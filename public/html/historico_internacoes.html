<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico de Internações - UTI Digital</title>
  <link rel="shortcut icon" href="/uploads/images/ui.png" type="image/x-icon" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/global.css">
  <link rel="stylesheet" href="/styles/historico_internacoes.css">
</head>

<body>
  <div class="app">

    <header>
      <div class="logo">
        <img src="/uploads/images/ui.png" alt="UTI Digital" height="50px">
      </div>
      <div class="badge-medico" id="roleBadge">...</div>
      <div class="doctor-name" id="doctorName">Carregando...</div>
    </header>

    <aside>
      <div class="menu-label">Menu Principal</div>

      <a href="/dashboard" class="nav-item">Dashboard</a>
      <a href="/gestao-leitos" class="nav-item">Gestão de Leitos</a>
      <a href="/cadastro-pacientes" class="nav-item">Cadastro de Pacientes</a>
      <a href="/historico-de-altas" class="nav-item">Histórico de Altas</a>
      <a href="/historico-internacoes" class="nav-item active">Histórico de Internações</a>
      <a href="/relatorios" class="nav-item">Relatórios</a>
      <a href="#" class="nav-item" id="navCadastroUsuarios" style="display: none;">Cadastro de Usuários</a>
      <form action="/auth/logout" method="POST" style="display:inline">
        <button type="submit" class="nav-item logout-btn" style="background:none;border:none;color:inherit;font:inherit;cursor:pointer;width:100%;text-align:left;padding:12px 16px;">Sair</button>
      </form>
    </aside>

    <main>
      <h1 class="page-title">Histórico de Internações</h1>

      <div id="internacoesCount" class="internacoes-count"></div>

      <div class="internacoes-list" id="internacoesList">
        <p class="no-internacoes">Carregando histórico de internações...</p>
      </div>
    </main>

  </div>

  <script src="/js/auth.js"></script>
  <script>
    function formatarDataHora(data) {
      if (!data) return '-';
      const d = new Date(data);
      return d.toLocaleDateString('pt-BR', { timeZone: 'America/Sao_Paulo' }) + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo' });
    }

    async function loadInternacoes() {
      try {
        const response = await fetch('/api/relatorios/internacoes');
        if (!response.ok) throw new Error('Erro ao carregar internacoes');
        const internacoes = await response.json();

        const list = document.getElementById('internacoesList');
        list.innerHTML = '';

        if (!internacoes || internacoes.length === 0) {
          document.getElementById('internacoesCount').textContent = '';
          list.innerHTML = '<p class="no-internacoes">Nenhuma internação registrada até o momento.</p>';
          return;
        }

        const ativas = internacoes.filter(i => !i.data_alta).length;
        document.getElementById('internacoesCount').textContent =
          internacoes.length + (internacoes.length === 1 ? ' internação registrada' : ' internações registradas') +
          ' — ' + ativas + (ativas === 1 ? ' em andamento' : ' em andamento');

        internacoes.forEach(internacao => {
          const card = document.createElement('div');
          card.className = 'internacao-card';
          const ativa = !internacao.data_alta;
          card.innerHTML = `
            <div class="internacao-card-info">
              <div>
                <span class="internacao-patient-name">${escapeHTML(internacao.paciente_nome) || '-'}</span>
                <span class="status-badge ${ativa ? 'ativa' : 'encerrada'}">${ativa ? 'Em andamento' : 'Alta'}</span>
              </div>
              <span class="internacao-detail">Leito: ${escapeHTML(String(internacao.leito_numero ?? internacao.leito_id))}</span>
              <span class="internacao-detail">Médico responsável: ${escapeHTML(internacao.medico_responsavel_nome) || '-'}</span>
              ${internacao.motivo_admissao ? '<span class="internacao-detail">Motivo: ' + escapeHTML(internacao.motivo_admissao) + '</span>' : ''}
              ${internacao.cpf ? '<span class="internacao-detail">CPF: ' + escapeHTML(internacao.cpf) + '</span>' : ''}
            </div>
            <div class="internacao-card-right">
              <div class="internacao-date" style="display: flex; flex-direction: column; gap: 4px; text-align: right;">
                <div>
                  <span class="internacao-date-label">Internação</span>
                  <div class="internacao-date-value">${escapeHTML(formatarDataHora(internacao.data_internacao))}</div>
                </div>
                <div>
                  <span class="internacao-date-label">${ativa ? 'Status' : 'Alta'}</span>
                  <div class="internacao-date-value">${ativa ? '—' : escapeHTML(formatarDataHora(internacao.data_alta))}</div>
                </div>
              </div>
            </div>
          `;
          list.appendChild(card);
        });
      } catch (error) {
        console.error('Erro ao carregar internacoes:', error);
        document.getElementById('internacoesList').innerHTML = '<p class="no-internacoes" style="color: red;">Erro ao carregar histórico de internações.</p>';
      }
    }

    loadUser();
    loadInternacoes();
  </script>
</body>

</html>
